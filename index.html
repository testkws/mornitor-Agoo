<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Scraper Monitor</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app-view" class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><div><h1>Scraper Monitor</h1><span class="live" id="live-status" title="Auto-refreshes every 30 seconds"><i></i><span id="live-text">Connecting…</span></span></div></div>
      <div class="account-actions"><label class="worker-picker">Worker<select id="active-worker"></select></label><button id="refresh" class="icon-btn" type="button" title="Refresh now" aria-label="Refresh now">&#8635;</button><button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button class="tab active" data-view="overview">Overview</button>
      <button class="tab" data-view="places">Places</button>
      <button class="tab" data-view="logs">Logs</button>
    </nav>
    <p id="global-error" class="error-message" role="alert"></p>
    <section id="overview-view" class="view"></section>
    <section id="places-view" class="view" hidden>
      <div class="section-heading"><div><h2>Places</h2><p class="muted">Collected evidence by OSM place.</p></div></div>
      <div class="filters">
        <label>Search<input id="place-query" type="search" placeholder="Name or OSM ID"></label>
        <label>Outcome<select id="place-outcome"><option value="">All outcomes</option><option>found</option><option>found_no_phone</option><option>not_found</option><option>ambiguous</option></select></label>
        <label>Queue status<select id="place-status"><option value="">All statuses</option><option>pending</option><option>running</option><option>retry_wait</option><option>checked</option><option>exhausted</option><option>skipped</option><option>blocked</option><option>failed</option></select></label>
        <label>Review<select id="place-review"><option value="">All</option><option value="true">Needs review</option><option value="false">No review flag</option></select></label>
        <button id="place-search">Apply</button>
      </div>
      <div id="places-table"></div>
      <div class="pager"><button id="places-prev" class="secondary">Previous</button><span id="places-page"></span><button id="places-next" class="secondary">Next</button></div>
    </section>
    <section id="logs-view" class="view" hidden>
      <div class="section-heading"><div><h2>Operational logs</h2><p class="muted">Worker events with server receipt times.</p></div></div>
      <div class="filters">
        <label>Worker<select id="log-worker"></select></label>
        <label>Severity<select id="log-severity"><option value="">All severities</option><option>debug</option><option>info</option><option>warning</option><option>error</option></select></label>
        <label>From<input id="log-from" type="datetime-local"></label>
        <label>To<input id="log-to" type="datetime-local"></label>
        <button id="log-search">Apply</button>
      </div>
      <div id="logs-table"></div>
      <div class="pager"><button id="logs-prev" class="secondary">Previous</button><span id="logs-page"></span><button id="logs-next" class="secondary">Next</button></div>
    </section>
  </div>

  <dialog id="place-dialog" class="detail-dialog">
    <div class="dialog-head"><div><p class="eyebrow">Place evidence</p><h2 id="detail-title"></h2></div><button id="detail-close" class="secondary">Close</button></div>
    <div id="detail-content"></div>
    <h3>Attempt history</h3>
    <div id="attempts-table"></div>
    <div class="pager"><button id="attempts-prev" class="secondary">Previous</button><span id="attempts-page"></span><button id="attempts-next" class="secondary">Next</button></div>
  </dialog>
</body>
</html>
